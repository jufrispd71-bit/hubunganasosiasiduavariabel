                            blue: '#1e3a8a',

    <style>
        body { margin: 0; padding: 0; background-color: #0f172a; overflow: hidden; }

            width: 100vw;
            height: 56.25vw;

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Data Kuis
        const rawQuizData = [
            { q: "Manakah di bawah ini yang merupakan contoh variabel kualitatif (kategorikal)?", options: ["Tinggi badan", "Nilai ulangan", "Jenis transportasi ke sekolah", "Waktu tempuh ke sekolah"], answer: 2 },
            { q: "Manakah di bawah ini yang merupakan contoh variabel kuantitatif (numerikal)?", options: ["Warna favorit", "Jumlah jam belajar", "Golongan darah", "Program ekstrakurikuler"], answer: 1 },
            { q: "Untuk melihat asosiasi antara dua variabel kualitatif, cara terbaik adalah menggunakan...", options: ["Diagram pencar (Scatter plot)", "Tabel kontingensi", "Diagram garis", "Histogram"], answer: 1 },
            { q: "Diagram pencar (scatter plot) sangat cocok digunakan untuk melihat hubungan antara...", options: ["Dua variabel kualitatif", "Satu variabel kualitatif dan satu kuantitatif", "Dua variabel kuantitatif", "Tidak ada variabel"], answer: 2 },
            { q: "Jika titik-titik pada diagram pencar membentuk pola menyebar dari kiri bawah ke kanan atas, maka hubungannya adalah...", options: ["Hubungan positif", "Hubungan negatif", "Tidak ada hubungan", "Hubungan konstan"], answer: 0 },
            { q: "Jika semakin banyak siswa bolos kelas, nilai ujiannya cenderung semakin rendah. Ini adalah contoh dari...", options: ["Asosiasi positif", "Asosiasi negatif", "Tidak ada asosiasi", "Asosiasi kualitatif"], answer: 1 },
            { q: "Pada tabel kontingensi, hubungan dua variabel kategorikal dapat dilihat dengan...", options: ["Menghitung rata-rata", "Mencari titik potong (intercept)", "Membandingkan proporsi/persentase pada kategori", "Menggambar garis lurus"], answer: 2 },
            { q: "Jika titik-titik pada diagram pencar tersebar acak tanpa membentuk pola garis, kesimpulannya adalah...", options: ["Hubungan sangat kuat", "Hubungan positif", "Hubungan negatif", "Tidak ada hubungan (nol)"], answer: 3 },
            { q: "Contoh hubungan yang kemungkinan besar memiliki asosiasi positif adalah...", options: ["Jam tidur dan rasa kantuk di kelas", "Lama waktu berlatih dan kecepatan lari", "Usia mobil dan harga jual mobil", "Waktu belajar dan nilai ujian"], answer: 3 },
            { q: "Diketahui tabel ekstrakurikuler (Pramuka, PMR) dan Jenis Kelamin (L/P). Apa jenis variabel pada kasus ini?", options: ["Keduanya variabel kuantitatif", "Keduanya variabel kualitatif (kategorikal)", "Satu kualitatif, satu kuantitatif", "Variabel kontinu"], answer: 1 }
        ];

        // Utility: Mengacak Array
        const shuffleArray = (array) => {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        };

        const ScatterPlot = ({ data, type }) => {
            return (
                <div className="relative w-full h-full flex flex-col items-center justify-center p-4">
                    <svg viewBox="0 0 400 300" className="w-full h-full max-h-64 bg-slate-50 border-l-4 border-b-4 border-slate-700">
                        {/* Grid lines */}
                        <line x1="0" y1="75" x2="400" y2="75" stroke="#e2e8f0" strokeWidth="1" />
                        <line x1="0" y1="150" x2="400" y2="150" stroke="#e2e8f0" strokeWidth="1" />
                        <line x1="0" y1="225" x2="400" y2="225" stroke="#e2e8f0" strokeWidth="1" />
                        <line x1="100" y1="0" x2="100" y2="300" stroke="#e2e8f0" strokeWidth="1" />
                        <line x1="200" y1="0" x2="200" y2="300" stroke="#e2e8f0" strokeWidth="1" />
                        <line x1="300" y1="0" x2="300" y2="300" stroke="#e2e8f0" strokeWidth="1" />
                        
                        {/* Points */}
                        {data.map((pt, i) => (
                            <circle key={i} cx={pt.x * 4} cy={300 - (pt.y * 3)} r="6" fill="#3b82f6" fillOpacity="0.7" stroke="#1e3a8a" strokeWidth="1.5">
                                <title>X: {pt.x}, Y: {pt.y}</title>
                            </circle>
                        ))}
                    </svg>
                    <div className="flex justify-between w-full text-xs font-semibold text-slate-500 mt-2">
                        <span>Rendah (X)</span>
                        <span>Tinggi (X)</span>
                    </div>
                </div>
            );
        };

        const SimpleBarChart = () => (
            <svg viewBox="0 0 300 200" className="w-full h-full max-h-48">
                <line x1="40" y1="160" x2="280" y2="160" stroke="#334155" strokeWidth="2" />
                <line x1="40" y1="20" x2="40" y2="160" stroke="#334155" strokeWidth="2" />
                
                {/* Laki-Laki */}
                <rect x="70" y="60" width="40" height="100" fill="#3b82f6" rx="2" />
                <rect x="110" y="100" width="40" height="60" fill="#facc15" rx="2" />
                <text x="90" y="180" fontSize="12" textAnchor="middle" fill="#334155" fontWeight="bold">Laki-laki</text>
                
                {/* Perempuan */}
                <rect x="180" y="90" width="40" height="70" fill="#3b82f6" rx="2" />
                <rect x="220" y="50" width="40" height="110" fill="#facc15" rx="2" />
                <text x="200" y="180" fontSize="12" textAnchor="middle" fill="#334155" fontWeight="bold">Perempuan</text>
                
                {/* Legend */}
                <rect x="230" y="10" width="10" height="10" fill="#3b82f6" />
                <text x="245" y="20" fontSize="10" fill="#334155">Suka Math</text>
                <rect x="230" y="25" width="10" height="10" fill="#facc15" />
                <text x="245" y="35" fontSize="10" fill="#334155">Tdk Suka</text>
            </svg>
        );

        const TopNav = ({ current, setPage }) => (
            <div className="h-16 bg-brand-blue text-white flex items-center justify-between px-6 shadow-md z-10 shrink-0">
                <div className="flex items-center gap-3 font-bold text-xl">
                    <i className="fa-solid fa-chart-line text-brand-yellow"></i>
                    <span>Asosiasi Dua Variabel</span>
                </div>
                <div className="flex gap-2">
                    <button onClick={() => setPage('home')} className={`px-4 py-2 rounded-lg font-semibold transition ${current === 'home' ? 'bg-brand-yellow text-brand-blue' : 'hover:bg-brand-lightBlue'}`}>
                        <i className="fa-solid fa-home mr-2"></i>Beranda
                    </button>
                    <button onClick={() => setPage('tujuan')} className={`px-4 py-2 rounded-lg font-semibold transition ${current === 'tujuan' ? 'bg-brand-yellow text-brand-blue' : 'hover:bg-brand-lightBlue'}`}>
                        <i className="fa-solid fa-bullseye mr-2"></i>Tujuan Pembelajaran
                    </button>
                    <button onClick={() => setPage('materi')} className={`px-4 py-2 rounded-lg font-semibold transition ${current === 'materi' ? 'bg-brand-yellow text-brand-blue' : 'hover:bg-brand-lightBlue'}`}>
                        <i className="fa-solid fa-book-open mr-2"></i>Materi
                    </button>
                    <button onClick={() => setPage('kuis')} className={`px-4 py-2 rounded-lg font-semibold transition ${current === 'kuis' || current === 'hasil' ? 'bg-brand-yellow text-brand-blue' : 'hover:bg-brand-lightBlue'}`}>
                        <i className="fa-solid fa-gamepad mr-2"></i>Kuis
                    </button>
                </div>
            </div>
        );

        const HomeView = ({ setPage }) => (
            <div className="flex-1 flex flex-col items-center justify-center bg-brand-gray relative overflow-hidden text-center p-8">
                {/* Decorative background shapes */}
                <div className="absolute top-[-10%] left-[-5%] w-64 h-64 bg-brand-yellow opacity-20 rounded-full blur-3xl"></div>
                <div className="absolute bottom-[-10%] right-[-5%] w-80 h-80 bg-brand-blue opacity-10 rounded-full blur-3xl"></div>
                
                <div className="z-10 max-w-4xl">
                    <div className="bg-brand-blue text-brand-yellow font-bold px-4 py-1 rounded-full inline-block mb-4 text-sm tracking-wider uppercase">
                        Matematika Tingkat Lanjut – Kelas XII SMA
                    </div>
                    <h1 className="text-5xl font-extrabold text-brand-dark mb-6 leading-tight">
                        Hubungan Asosiasi <br/><span className="text-brand-lightBlue">Dua Variabel</span>
                    </h1>
                    
                    <div className="flex items-center justify-center gap-8 mb-10">
                        <div className="bg-white p-4 rounded-2xl shadow-lg flex items-center gap-4 w-56 border-t-4 border-brand-yellow">
                            <i className="fa-solid fa-users text-4xl text-brand-lightBlue"></i>
                            <div className="text-left"><p className="font-bold text-sm">Kategorikal</p><p className="text-xs text-slate-500">Tabel Kontingensi</p></div>
                        </div>
                        <div className="text-3xl text-brand-blue font-black animate-pulse"><i className="fa-solid fa-arrow-right-arrow-left"></i></div>
                        <div className="bg-white p-4 rounded-2xl shadow-lg flex items-center gap-4 w-56 border-t-4 border-brand-blue">
                            <i className="fa-solid fa-chart-line text-4xl text-brand-yellow"></i>
                            <div className="text-left"><p className="font-bold text-sm">Numerikal</p><p className="text-xs text-slate-500">Diagram Pencar</p></div>
                        </div>
                    </div>

                    <p className="text-lg text-slate-600 mb-8 max-w-2xl mx-auto">
                        Mari pelajari cara membaca data dan menemukan pola hubungan antara variabel kualitatif dan kuantitatif secara visual!
                    </p>

                    <button 
                        onClick={() => setPage('tujuan')} 
                        className="bg-brand-yellow text-brand-dark font-bold text-xl px-10 py-4 rounded-full shadow-lg btn-hover flex items-center gap-3 mx-auto"
                    >
                        <i className="fa-solid fa-rocket"></i> Mulai Belajar
                    </button>
                </div>
            </div>
        );

        const TujuanView = ({ setPage }) => (
            <div className="flex-1 flex flex-col items-center justify-center bg-white p-8 relative">
                <div className="max-w-4xl text-center">
                    <div className="inline-flex items-center justify-center w-20 h-20 bg-brand-lightBlue text-white rounded-full text-4xl mb-6 shadow-lg">
                        <i className="fa-solid fa-bullseye"></i>
                    </div>
                    <h2 className="text-3xl font-bold text-brand-dark mb-8">Tujuan Pembelajaran</h2>
                    
                    <div className="bg-brand-gray border-l-8 border-brand-yellow p-8 rounded-r-2xl shadow-inner text-2xl leading-relaxed text-brand-dark font-medium mb-12 italic">
                        “Murid mampu menjelaskan hubungan asosiasi antara dua variabel kualitatif (kategorikal) dan dua variabel kuantitatif (numerikal).”
                    </div>

                    <button 
                        onClick={() => setPage('materi')} 
                        className="bg-brand-blue text-white font-bold text-lg px-8 py-3 rounded-full shadow-md btn-hover inline-flex items-center gap-2"
                    >
                        Lanjut ke Materi <i className="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        );

        
        // A. Mengenal Variabel
        const MateriA = () => (
            <div className="h-full flex flex-col justify-center">
                <h3 className="text-2xl font-bold text-brand-blue mb-6 flex items-center gap-3"><i className="fa-solid fa-tag text-brand-yellow"></i> A. Mengenal Variabel</h3>
                <p className="text-slate-700 mb-6 text-lg">Dalam statistika, <strong>variabel</strong> adalah karakteristik yang diamati yang dapat memiliki nilai berbeda-beda. Variabel terbagi menjadi dua jenis utama:</p>
                
                <div className="grid grid-cols-2 gap-6 flex-1">
                    <div className="bg-blue-50 p-6 rounded-xl border border-blue-200 shadow-sm flex flex-col">
                        <div className="flex items-center gap-3 mb-4 text-brand-blue font-bold text-xl">
                            <i className="fa-solid fa-shapes text-3xl"></i> Variabel Kualitatif (Kategorikal)
                        </div>
                        <p className="text-slate-600 mb-4 flex-1">Data yang berupa kelompok, kategori, atau kualitas. Tidak memiliki nilai numerik bermakna secara matematis.</p>
                        <div className="bg-white p-4 rounded-lg text-sm border-l-4 border-blue-400">
                            <strong>Contoh di Sekolah:</strong><br/>
                            • Jenis Kelamin (Laki-laki / Perempuan)<br/>
                            • Pilihan Ekstrakurikuler (Pramuka / PMR / Rohis)<br/>
                            • Jenis Transportasi (Jalan kaki / Motor / Angkot)
                        </div>
                    </div>

                    <div className="bg-yellow-50 p-6 rounded-xl border border-yellow-200 shadow-sm flex flex-col">
                        <div className="flex items-center gap-3 mb-4 text-yellow-700 font-bold text-xl">
                            <i className="fa-solid fa-hashtag text-3xl"></i> Variabel Kuantitatif (Numerikal)
                        </div>
                        <p className="text-slate-600 mb-4 flex-1">Data yang berupa angka dan dapat diukur. Dapat dilakukan operasi matematika seperti rata-rata.</p>
                        <div className="bg-white p-4 rounded-lg text-sm border-l-4 border-yellow-400">
                            <strong>Contoh di Sekolah:</strong><br/>
                            • Usia Murid (16, 17, 18 tahun)<br/>
                            • Tinggi Badan (165 cm, 170 cm)<br/>
                            • Waktu Belajar (2 jam, 3 jam)<br/>
                            • Nilai Matematika (85, 90, 78)
                        </div>
                    </div>
                </div>
            </div>
        );

        // B. Kualitatif
        const MateriB = () => (
            <div className="h-full flex flex-col justify-center">
                <h3 className="text-2xl font-bold text-brand-blue mb-4 flex items-center gap-3"><i className="fa-solid fa-table-cells text-brand-yellow"></i> B. Hubungan Dua Variabel Kualitatif</h3>
                <p className="text-slate-700 mb-4 text-lg">Asosiasi antara dua variabel kategorikal dapat dilihat dengan <strong>Tabel Kontingensi</strong> (Tabel Silang). Kita membandingkan proporsi/frekuensi antar kategori.</p>
                
                <div className="grid grid-cols-2 gap-8 items-center bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <div>
                        <h4 className="font-bold text-slate-800 mb-3 text-center">Tabel Kontingensi:<br/>Kebiasaan Sarapan & Fokus Belajar</h4>
                        <table className="w-full text-center border-collapse text-sm">
                            <thead>
                                <tr className="bg-brand-blue text-white">
                                    <th className="border p-2"></th>
                                    <th className="border p-2">Fokus</th>
                                    <th className="border p-2">Tidak Fokus</th>
                                    <th className="border p-2 bg-slate-700">Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td className="border p-2 font-bold bg-slate-100">Sarapan</td>
                                    <td className="border p-2 bg-blue-50 font-bold text-brand-blue">30 (75%)</td>
                                    <td className="border p-2">10 (25%)</td>
                                    <td className="border p-2 font-bold">40</td>
                                </tr>
                                <tr>
                                    <td className="border p-2 font-bold bg-slate-100">Tidak Sarapan</td>
                                    <td className="border p-2">10 (25%)</td>
                                    <td className="border p-2 bg-yellow-100 font-bold text-yellow-700">30 (75%)</td>
                                    <td className="border p-2 font-bold">40</td>
                                </tr>
                            </tbody>
                        </table>
                        <p className="text-sm text-slate-500 mt-3 bg-blue-50 p-3 rounded text-center">
                            <strong>Kesimpulan Visual:</strong> Terlihat perbedaan pola. Murid yang sarapan cenderung lebih fokus. Ada asosiasi!
                        </p>
                    </div>
                    <div className="flex flex-col items-center">
                        <h4 className="font-bold text-slate-800 mb-2">Diagram Batang Proporsi</h4>
                        <div className="w-full flex-1">
                             <svg viewBox="0 0 300 200" className="w-full h-full max-h-48">
                                {/* Axes */}
                                <line x1="40" y1="160" x2="280" y2="160" stroke="#94a3b8" strokeWidth="2" />
                                <text x="90" y="180" fontSize="12" textAnchor="middle" fill="#334155" fontWeight="bold">Sarapan</text>
                                <text x="210" y="180" fontSize="12" textAnchor="middle" fill="#334155" fontWeight="bold">Tdk Sarapan</text>
                                
                                {/* Bars Sarapan */}
                                <rect x="70" y="40" width="40" height="120" fill="#3b82f6" rx="2" /> {/* 75% Fokus */}
                                <rect x="110" y="120" width="40" height="40" fill="#facc15" rx="2" /> {/* 25% Tdk Fokus */}
                                
                                {/* Bars Tidak Sarapan */}
                                <rect x="190" y="120" width="40" height="40" fill="#3b82f6" rx="2" /> {/* 25% Fokus */}
                                <rect x="230" y="40" width="40" height="120" fill="#facc15" rx="2" /> {/* 75% Tdk Fokus */}

                                {/* Legend */}
                                <rect x="230" y="0" width="12" height="12" fill="#3b82f6" />
                                <text x="250" y="10" fontSize="10" fill="#334155">Fokus</text>
                                <rect x="230" y="16" width="12" height="12" fill="#facc15" />
                                <text x="250" y="26" fontSize="10" fill="#334155">Tdk Fokus</text>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        );

        // C. Kuantitatif
        const MateriC = () => {
            const data = [
                {x: 10, y: 30}, {x: 20, y: 40}, {x: 30, y: 45}, {x: 40, y: 60},
                {x: 50, y: 65}, {x: 60, y: 75}, {x: 70, y: 80}, {x: 80, y: 90}, {x: 90, y: 95}
            ];
            return (
                <div className="h-full flex flex-col justify-center">
                    <h3 className="text-2xl font-bold text-brand-blue mb-4 flex items-center gap-3"><i className="fa-solid fa-arrow-trend-up text-brand-yellow"></i> C. Hubungan Dua Variabel Kuantitatif</h3>
                    <p className="text-slate-700 mb-4 text-lg">Untuk variabel berupa angka (numerik), kita menggunakan <strong>Diagram Pencar (Scatter Plot)</strong>. Setiap titik mewakili satu individu dengan dua nilai (X dan Y).</p>
                    
                    <div className="grid grid-cols-2 gap-6 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <div className="flex flex-col justify-center">
                            <h4 className="font-bold text-xl text-slate-800 mb-3 border-b-2 border-brand-yellow inline-block pb-1">Contoh Kasus</h4>
                            <ul className="text-slate-700 space-y-4 mb-4">
                                <li className="flex items-start gap-2"><i className="fa-solid fa-clock text-brand-lightBlue mt-1"></i> <div><strong>Waktu Belajar & Nilai Ujian</strong><br/><span className="text-sm">Apakah belajar lebih lama menghasilkan nilai lebih tinggi?</span></div></li>
                                <li className="flex items-start gap-2"><i className="fa-solid fa-bed text-brand-lightBlue mt-1"></i> <div><strong>Jam Tidur & Konsentrasi</strong><br/><span className="text-sm">Apakah kurang tidur menurunkan fokus belajar?</span></div></li>
                            </ul>
                            <div className="bg-yellow-50 p-3 rounded text-sm text-yellow-800 border-l-4 border-brand-yellow">
                                Dengan diagram pencar, kita bisa melihat apakah titik-titik membentuk suatu <strong>pola garis</strong>.
                            </div>
                        </div>
                        <div className="bg-slate-50 p-4 rounded-xl flex flex-col items-center">
                            <h4 className="font-bold text-slate-700 text-sm mb-2 text-center">Diagram Pencar:<br/>Waktu Belajar (X) vs Nilai Matematika (Y)</h4>
                            <div className="w-full h-48 relative">
                                <ScatterPlot data={data} type="positive" />
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // D. Membaca Diagram Pencar
        const MateriD = () => {
            const [selectedType, setSelectedType] = useState('positive');
            
            const dataSets = {
                positive: [{x:10,y:20},{x:20,y:35},{x:30,y:40},{x:40,y:55},{x:50,y:60},{x:60,y:80},{x:70,y:85},{x:80,y:95},{x:90,y:100}],
                negative: [{x:10,y:90},{x:20,y:85},{x:30,y:70},{x:40,y:60},{x:50,y:50},{x:60,y:45},{x:70,y:30},{x:80,y:20},{x:90,y:10}],
                none: [{x:10,y:50},{x:20,y:20},{x:30,y:80},{x:40,y:10},{x:50,y:90},{x:60,y:40},{x:70,y:70},{x:80,y:30},{x:90,y:60},{x:15,y:75},{x:45,y:45},{x:85,y:85}]
            };

            const info = {

                    <div key={page} className="flex-1 flex flex-col overflow-hidden page-transition">
                        {page === 'home' && <HomeView setPage={setPage} />}
                        {page === 'tujuan' && <TujuanView setPage={setPage} />}
                        {page === 'materi' && <MateriView setPage={setPage} />}
                        {page === 'kuis' && <QuizView setPage={setPage} setFinalScore={setFinalScore} />}
                        {page === 'hasil' && <ResultView setPage={setPage} finalScore={finalScore} />}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
